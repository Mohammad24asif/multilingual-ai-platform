[project]
name = "multilingual-ai-platform-backend"
version = "0.1.0"
description = "Neural machine translation and multilingual NLP for English and Indian languages"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# Real translation engines. CPU-only PyTorch is selected through [tool.uv.sources] below.
ml = [
  "torch>=2.4",
  "transformers>=4.45",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "safetensors>=0.4",
]
# Only for the IndicTrans2 models (they also need a pinned, reviewed revision - see docs/INSTALLATION.md).
indictrans2 = ["IndicTransToolkit"]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["model: loads real model weights (slow; needs downloaded models)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
